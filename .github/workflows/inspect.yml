name: Inspect tickers

# Prints the raw Yahoo Finance data behind a few tickers, to debug odd values on the site.
# Actions -> "Inspect tickers" -> Run workflow, then read the job log.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Yahoo Finance symbols, separated by spaces (e.g. AAPL CEZ.PR SAP.DE)"
        default: "GMEX CYNCA.ST"
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/inspect.yml"
      - "stockdb/inspect.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMBOLS: ${{ github.event.inputs.symbols || 'KNSL WT EVTC NIC ABCB BRC MWA BOTJ PKE KELYA FCCO GNTX CNP TSBK MGEE MGA BBAR SLF ELPC BMY HASI CBL SELF BGR GLPI BBDC TCG.MI CLIQ.DE BURE.ST MMGR-B.ST SES.MI OBS.VI VOX.WA MAERSK-B.CO DURC-B.ST 3ITN.DE REC.MI ETTE.HE FAA.VI NREST.ST ZV.MI BG.VI BBVA.MC CEDER.ST TELL.AT ACE.MI SCYR.MC UNITED.HE TSM1T.TL AYV.PA LOIHDE.HE CAI.MI KGH.PR NOKIA.PR RWE.PR RBI.PR ANDR.PR SHELL.PR MOL.PR OMV.PR PKN.PR TABAK.PR' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Raw Yahoo Finance data
        run: python -m stockdb inspect --compact $SYMBOLS
