name: Inspect tickers

# Prints the raw Yahoo Finance data behind a few tickers, to debug odd values on the site.
# Actions -> "Inspect tickers" -> Run workflow, then read the job log.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Yahoo Finance symbols, separated by spaces (e.g. AAPL CEZ.PR SAP.DE)"
        default: "GMEX CYNCA.ST"
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/inspect.yml"
      - "stockdb/inspect.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMBOLS: ${{ github.event.inputs.symbols || 'GMEX CYNCA.ST LARK.ST PRODEA.AT LX STX.WA NHTC ICMB ABR AZUL CHSN MPT.MI AAPL KO CEZ.PR KOMB.PR' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Raw Yahoo Finance data
        run: python -m stockdb inspect $SYMBOLS
