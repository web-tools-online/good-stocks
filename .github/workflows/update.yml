name: Update stock data

# Weekly refresh of the stock database and the website.
#   universe  - builds the list of all US / EU / Czech tickers and splits it into shards
#   fetch     - downloads fundamentals from Yahoo Finance, one parallel job per shard
#   build     - stores the current snapshot in the SQLite database (+ older US annual
#               figures from SEC EDGAR when missing), publishes the database as a
#               release asset and builds the website
#   deploy    - publishes the website on GitHub Pages
# Pushes to other branches than main run a small smoke test and publish nothing.

on:
  schedule:
    - cron: "23 4 * * 6" # every Saturday 04:23 UTC (after Friday's US close)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max tickers per market (0 = all). A non-zero value is a test run and publishes nothing."
        default: "0"
  push:
    branches: ["**"]
    paths:
      - "stockdb/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write # release asset with the database + weekly summary commit
  pages: write
  id-token: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

env:
  LIMIT: ${{ github.event.inputs.limit || (github.ref == 'refs/heads/main' && '0' || '15') }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event.inputs.limit || '0') == '0' }}
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  universe:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.universe.outputs.shards }}
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the current database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download data --pattern stocks.db --dir work --repo "$GITHUB_REPOSITORY" \
            || echo "No database published yet - starting a new one"
      - name: Build the ticker universe
        id: universe
        run: |
          if [ "$LIMIT" = "0" ]; then SHARDS=12; else SHARDS=2; fi
          python -m stockdb universe --db work/stocks.db --out work/universe.json --shards "$SHARDS" --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: universe
          path: work/universe.json
          retention-days: 7

  fetch:
    needs: universe
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.universe.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: work
      - name: Fetch fundamentals (shard ${{ matrix.shard }})
        run: |
          python -m stockdb fetch --universe work/universe.json --shard ${{ matrix.shard }} \
            --out work/raw/raw-${{ matrix.shard }}.jsonl.gz --rate 3 --max-minutes 310
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.shard }}
          path: work/raw/
          retention-days: 7
          if-no-files-found: warn

  build:
    needs: [universe, fetch]
    # Build even if a shard failed: listings it missed keep last week's data.
    if: ${{ !cancelled() && needs.universe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the current database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download data --pattern stocks.db --dir work --repo "$GITHUB_REPOSITORY" \
            || echo "No database published yet - starting a new one"
      - uses: actions/download-artifact@v4
        with:
          name: universe
          path: work
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: work/raw
          merge-multiple: true
      - name: Update the database
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m stockdb build --db work/stocks.db --universe work/universe.json --raw "work/raw/*.jsonl.gz"
      - name: Export the website
        run: python -m stockdb export --db work/stocks.db --site site --out _site --summary data/summary.json
      - name: Summary
        run: |
          echo '### Stock database update' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh work/stocks.db
          python -m stockdb report --db work/stocks.db
      - name: Back up the database as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocks-db
          path: work/stocks.db
          retention-days: 30
      - name: Publish the database as a release asset
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create data --repo "$GITHUB_REPOSITORY" --title "Stock database" --latest=false \
                 --notes "SQLite database with all US, EU and Czech stocks. Updated every week by the 'Update stock data' workflow."
          gh release upload data work/stocks.db --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: _site
      - name: Commit the weekly summary
        # A small commit every week also keeps GitHub from pausing the schedule
        # (scheduled workflows are disabled after 60 days without repository activity).
        if: env.PUBLISH == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly data update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: [universe, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.universe.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
